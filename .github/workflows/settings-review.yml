name: Unified Settings review
on:
  push:
    branches: [codex/unified-settings-20261028]
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/settings-notifications.test.mjs
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.local.config.ts tests/browser/settings-hub.spec.ts --project=phone --max-failures=0
      - run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-phone-review
          path: |
            .wrangler/settings-review/
            .wrangler/browser-results/
          include-hidden-files: true
          retention-days: 7
