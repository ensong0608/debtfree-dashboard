name: Check Cloudflare deployment access
on:
  push:
    branches: [codex/supabase-google-login]
    paths: [.github/workflows/cloudflare-access.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-access:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token and locate existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN repository secret is missing');
          async function api(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: { Authorization: 'Bearer ' + token },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) {
              throw new Error('Cloudflare request failed for ' + path + ': HTTP ' + response.status
                + '; codes=' + (payload.errors ?? []).map(e => e.code).join(','));
            }
            return payload.result;
          }
          const verified = await api('/user/tokens/verify');
          if (verified.status !== 'active') throw new Error('Cloudflare token is not active');
          console.log('Cloudflare token is active.');
          const accounts = await api('/accounts');
          let found = false;
          for (const account of accounts) {
            const workers = await api('/accounts/' + account.id + '/workers/scripts');
            if (!workers.some(worker => worker.id === 'debtfree-dashboard')) continue;
            const db = await api('/accounts/' + account.id + '/d1/database/3f2dd9d5-77de-4945-8e13-f6c1af454de1');
            if (db.name !== 'debtfree-dashboard-prod') throw new Error('Production database identity mismatch');
            const deployments = await api('/accounts/' + account.id + '/workers/scripts/debtfree-dashboard/deployments');
            console.log('Verified production Worker: debtfree-dashboard');
            console.log('Cloudflare account ID: ' + account.id);
            console.log('Verified existing D1 database: debtfree-dashboard-prod');
            console.log('Current deployment IDs: ' + deployments.deployments.map(d => d.id).join(', '));
            found = true;
          }
          if (!found) throw new Error('Token cannot see the existing debtfree-dashboard Worker');
          console.log('Read-only checks passed. No production settings or data changed.');
          NODE
