# Approved private production release: back up and verify stored rows before reporting success.
name: Deploy Cloudflare dashboard
on:
  push:
    branches: [codex/supabase-google-login, codex/mobile-payments-budget, codex/production-release-20261015]
    paths: [.github/workflows/deploy-cloudflare.yml, "app/**", "tests/**"]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full suite only when explicitly requested by the owner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser for explicitly requested full validation
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: npx playwright install --with-deps chromium
      - name: Full validation (owner opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: npm run validate
      - name: Detect debt experience changes
        id: loan_changes
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          before="$RELEASE_BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then before=HEAD^; fi
          if ! git diff --quiet "$before" HEAD -- app/loan-progress.ts app/loan-progress-panel.tsx app/loan-entry.ts app/loan-details-fields.tsx app/dashboard-client.tsx app/debt-experience.tsx app/debt-experience.module.css app/payoff-schedule.ts app/payments-page.tsx app/debt-entry-dialog.tsx tests/browser/debt-experience.spec.ts; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install browser for focused debt checks
        if: steps.loan_changes.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Verify navigation, debt details, schedule and loan forms on phone
        if: steps.loan_changes.outputs.changed == 'true'
        run: npx playwright test tests/browser/debt-experience.spec.ts tests/browser/compact-headers.spec.ts --project=phone
      - name: Confirm existing production resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (account !== '005a72abf0c701cfc067867e4f3ba034') throw new Error('Unexpected Cloudflare account');
          async function api(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + path, {
              headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error('Cloudflare preflight failed: HTTP ' + response.status);
            return payload.result;
          }
          const workers = await api('/workers/scripts');
          if (!workers.some(w => w.id === 'debtfree-dashboard')) throw new Error('Production Worker is missing');
          const db = await api('/d1/database/3f2dd9d5-77de-4945-8e13-f6c1af454de1');
          if (db.name !== 'debtfree-dashboard-prod') throw new Error('Production D1 mismatch');
          const deploymentState = await api('/workers/scripts/debtfree-dashboard/deployments');
          console.log('Current production deployment IDs: ' + deploymentState.deployments.map(d => d.id).join(', '));
          console.log('Confirmed existing production Worker and D1. Stage 6 adds only invitation/request tables after the encrypted recovery checkpoint.');
          NODE
      - name: Rehearse restoration in disposable unbound remote D1
        if: github.ref == 'refs/heads/codex/production-release-20261015' && github.event_name == 'workflow_dispatch' && inputs.full_suite
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/validate-remote-recovery.mjs
      - name: Prepare immediate pre-release encrypted recovery copy
        if: github.ref == 'refs/heads/codex/production-release-20261015'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-production-backup.mjs
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/codex/production-release-20261015'
        with:
          name: encrypted-production-recovery
          path: outputs/private-release/production-backup.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - name: Apply Stage 6 schema only when the committed migration changed
        if: github.ref == 'refs/heads/codex/production-release-20261015'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          before="$RELEASE_BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then before=HEAD^; fi
          if git diff --quiet "$before" HEAD -- drizzle/0001_household_lifecycle.sql; then
            echo "Committed schema unchanged; no remote migration applied."
          else
            npx wrangler d1 execute debtfree-dashboard-prod --remote --config wrangler.jsonc --file drizzle/0001_household_lifecycle.sql --yes
          fi
      - name: Configure production authentication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          Object.assign(config.vars, {
            HOUSEHOLD_LIFECYCLE_ENABLED: 'true',
            HOUSEHOLD_CREATION_EMAILS: '',
            AUTH_PROVIDER: 'supabase',
            SUPABASE_URL: 'https://acpderotiyoecmwwyfsu.supabase.co',
            SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_QP7A5zZPic3K-L9Bf-oUaA_cNkdtCCy',
            APP_ORIGIN: 'https://debtfree-dashboard.ensong0608.workers.dev',
          });
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2) + '\n');
          NODE
      - run: npm run deploy:check
      - name: Publish validated source with production settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars
      - name: Verify stored production rows unchanged
        if: github.ref == 'refs/heads/codex/production-release-20261015'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-preservation.mjs
      - name: Check Google login and protected household data
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://debtfree-dashboard.ensong0608.workers.dev';
          let ready=false;
          for(let attempt=0;attempt<6;attempt++) {
            try {
              const response=await fetch(origin+'/',{redirect:'manual',signal:AbortSignal.timeout(5000)});
              const location=response.headers.get('location')??'';
              const login=await fetch(origin+'/auth/login',{signal:AbortSignal.timeout(5000)});
              ready=[302,303,307].includes(response.status) && new URL(location,origin).pathname==='/auth/login' && login.ok && (await login.text()).includes('Sign in with Google');
            } catch { /* bounded propagation/network readiness */ }
            if(ready) break;
            if(attempt<5) await new Promise(resolve=>setTimeout(resolve,3000));
          }
          if(!ready) throw new Error('Production Google login did not become ready');
          for(const path of ['/api/household','/api/household/export','/api/household/lifecycle']) {
            const data=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(10000)});
            if(![401,403].includes(data.status)) throw new Error('Unauthenticated household data must be denied');
          }
          const signin=await fetch(origin+'/auth/google',{method:'POST',headers:{Origin:origin},redirect:'manual',signal:AbortSignal.timeout(10000)});
          const authorization=new URL(signin.headers.get('location')??'/',origin);
          if(signin.status!==303 || authorization.origin!=='https://acpderotiyoecmwwyfsu.supabase.co' || authorization.pathname!=='/auth/v1/authorize' || authorization.searchParams.get('provider')!=='google' || authorization.searchParams.get('prompt')!=='select_account' || authorization.searchParams.get('redirect_to')!==origin+'/auth/callback' || authorization.searchParams.get('code_challenge_method')!=='s256' || !authorization.searchParams.get('code_challenge')) throw new Error('Production Google account-choice/PKCE/callback configuration failed');
          console.log('Production Google login responds; household data requires authentication.');
          NODE
