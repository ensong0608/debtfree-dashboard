name: Deploy Cloudflare dashboard
on:
  push:
    branches: [codex/supabase-google-login]
    paths: [.github/workflows/deploy-cloudflare.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Confirm existing production resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (account !== '005a72abf0c701cfc067867e4f3ba034') throw new Error('Unexpected Cloudflare account');
          async function api(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + path, {
              headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error('Cloudflare preflight failed: HTTP ' + response.status);
            return payload.result;
          }
          const workers = await api('/workers/scripts');
          if (!workers.some(w => w.id === 'debtfree-dashboard')) throw new Error('Production Worker is missing');
          const db = await api('/d1/database/3f2dd9d5-77de-4945-8e13-f6c1af454de1');
          if (db.name !== 'debtfree-dashboard-prod') throw new Error('Production D1 mismatch');
          await api('/workers/scripts/debtfree-dashboard/deployments');
          console.log('Confirmed existing production Worker and D1. No database migration is needed.');
          NODE
      - name: Configure production authentication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          Object.assign(config.vars, {
            AUTH_PROVIDER: 'supabase',
            SUPABASE_URL: 'https://acpderotiyoecmwwyfsu.supabase.co',
            SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_QP7A5zZPic3K-L9Bf-oUaA_cNkdtCCy',
            APP_ORIGIN: 'https://debtfree-dashboard.ensong0608.workers.dev',
          });
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2) + '\n');
          NODE
      - run: npm run deploy:check
      - name: Publish validated source with production settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Check Cloudflare Access gate
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://debtfree-dashboard.ensong0608.workers.dev/', { redirect: 'manual' });
          const location = response.headers.get('location') ?? '';
          if (![302,303,307].includes(response.status) || !location.startsWith('https://ensong0608.cloudflareaccess.com/')) {
            throw new Error('Expected existing Cloudflare Access gate after deployment; HTTP ' + response.status);
          }
          console.log('Production URL responds and remains protected by Cloudflare Access.');
          NODE
