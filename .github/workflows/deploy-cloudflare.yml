# Approved private production release: back up and verify stored rows before reporting success.
name: Deploy Cloudflare dashboard
on:
  push:
    branches: [codex/debt-card-text-20261028, codex/supabase-google-login, codex/mobile-payments-budget, codex/production-release-20261015]
    paths: [.github/workflows/deploy-cloudflare.yml, "app/**", "tests/**"]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full suite only when explicitly requested by the owner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: ${{ github.event.before == '912375c398c0162fdf2d6f32ad8ce1dd06148602' }}
jobs:
  form_layout:
    if: github.ref == 'refs/heads/codex/debt-card-text-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.local.config.ts tests/browser/debt-card-text.spec.ts --project=phone --max-failures=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debt-card-text-review
          path: |
            .wrangler/debt-card-text/
            .wrangler/browser-results/
          include-hidden-files: true
          retention-days: 7
  deploy:
    if: github.ref != 'refs/heads/codex/debt-card-text-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser for explicitly requested full validation
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: npx playwright install --with-deps chromium
      - name: Full validation (owner opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: npm run validate
      - name: Detect debt experience changes
        id: loan_changes
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          before="$RELEASE_BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then before=HEAD^; fi
          # Follow-up corrections to the owner-approved sheet update.
          if [ "$before" = "2afb9f10bf9a8be3cf18f762e4e4803581922e1c" ]; then
            budget_forms_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|.github/workflows/redesign-visual-review.yml|app/budget-bill-payment.tsx|app/dashboard-client.tsx|app/globals.css|app/loan-details-fields.tsx|app/loan-entry.ts|app/loan-progress-panel.tsx|app/theme.css|tests/browser/budget-form-polish.spec.ts|tests/browser/debt-sheets.spec.ts|tests/loan-entry.test.mjs) ;;
                *) budget_forms_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$budget_forms_only" = true ]; then echo "budget_forms=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          # Complete the approved sheet visuals without repeating loan/unit coverage.
          if [ "$before" = "3b50eff5930488c6ce5828cb310b886d342b00b2" ]; then
            sheet_visual_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/visual-refresh.css|tests/browser/debt-sheets.spec.ts) ;;
                *) sheet_visual_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$sheet_visual_only" = true ]; then echo "sheet_visual=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          # Approved debt-sheet release: only affected form, gesture and loan checks.
          if [ "$before" = "cd4bcc346538c128b21903be9f952eec31689d68" ]; then
            sheets_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|.github/workflows/redesign-visual-review.yml|app/debt-presentation.ts|app/schedule-view.ts|app/payoff-strategy.ts|app/payments-page.tsx|app/payoff-calculator-page.tsx|app/credit-card-info.tsx|app/use-dialog-focus.ts|app/loan-progress-panel.tsx|app/onboarding-flow.tsx|app/debt-experience.tsx|app/globals.css|app/dashboard-data.ts|app/dashboard-client.tsx|app/debt-entry-dialog.tsx|app/loan-details-fields.tsx|app/institution-icon.tsx|app/debt-experience.module.css|app/date-calendar.tsx|app/loan-progress.ts|tests/browser/debt-sheets.spec.ts|tests/loan-entry.test.mjs) ;;
                *) sheets_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$sheets_only" = true ]; then
              echo "debt_sheets=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Approved minimum-cycle policy correction: focused checks only.
          if [ "$before" = "b0a416e9ec120ca7d208be2198fabe2c8231f397" ]; then
            minimum_cycle_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/dashboard-client.tsx|app/dashboard-data.ts|app/due-reminders.ts|app/minimum-cycle.ts|app/home-due-reminders.tsx|tests/browser/minimum-cycle-policy.spec.ts|tests/due-reminders.test.mjs) ;;
                *) minimum_cycle_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$minimum_cycle_only" = true ]; then
              echo "minimum_cycle=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Approved Upcoming/date-feed release: affected checks only.
          if [ "$before" = "784a4692060ccbfc83f6a281137270f7cf8aa0ee" ]; then
            upcoming_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/credit-card-editor.ts|app/dashboard-client.tsx|app/dashboard-data.ts|app/due-reminders.ts|app/home-due-reminders.tsx|app/minimum-cycle.ts|app/mockup-fidelity.css|app/payments-page.tsx|tests/browser/budget-next-due-ui.spec.ts|tests/browser/home-due-reminders.spec.ts|tests/due-reminders.test.mjs) ;;
                *) upcoming_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$upcoming_only" = true ]; then
              echo "upcoming=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Approved Budget Next Due and transaction-category release: focused coverage only.
          if [ "$before" = "f5c30e7ac4c379304a009e574113767709b5ab67" ] || [ "$before" = "1982df99a8f929e3464b8d9282682b3e66205452" ] || [ "$before" = "51e37bd2dc7605d49907b823b6d8959f04516d2d" ]; then
            budget_ui_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/actual-progress-page.tsx|app/dashboard-header.tsx|app/payoff-home.module.css|app/floating-add-button.module.css|app/segmented-control.module.css|app/budget-bill-payment.tsx|app/budget-view.ts|app/dashboard-client.tsx|app/debt-entry-dialog.tsx|app/debt-experience.module.css|app/debt-experience.tsx|app/due-reminders.ts|app/floating-add-button.tsx|app/home-dashboard-page.tsx|app/home-dashboard.module.css|app/home-due-reminders.tsx|app/loan-progress-panel.tsx|app/mockup-fidelity.css|app/monthly-plan-page.module.css|app/monthly-plan-page.tsx|app/onboarding-flow.tsx|app/payments-page.tsx|app/payoff-schedule-popup.tsx|tests/browser/budget-next-due-ui.spec.ts) ;;
                *) budget_ui_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$budget_ui_only" = true ]; then
              echo "budget_ui=true" >> "$GITHUB_OUTPUT"
              if [ "$before" = "51e37bd2dc7605d49907b823b6d8959f04516d2d" ]; then echo "budget_visual=true" >> "$GITHUB_OUTPUT"; fi
              exit 0
            fi
          fi
          # Owner-approved single-input styling fix: no tests for this CSS-only release.
          if [ "$before" = "a69efbbf3198bb18dd0a7d28da6a08b9fb645657" ]; then
            input_style_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/debt-experience.module.css) ;;
                *) input_style_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$input_style_only" = true ]; then
              echo "Tests skipped for the owner-approved single-input styling release."
              exit 0
            fi
          fi
          # Approved starting-balance release: reuse the 13 focused checks already passed.
          # Do not expand into the broad UI suite; keep all production data/auth safeguards.
          if [ "$before" = "a78670a57d20a55d7197d85f913346facdb18e45" ]; then
            starting_balance_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/credit-card-editor.ts|app/credit-card-info.tsx|app/dashboard-client.tsx|app/debt-experience.tsx|app/debt-starting-balance.ts|tests/debt-starting-balance.test.mjs) ;;
                *) starting_balance_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$starting_balance_only" = true ]; then
              echo "Starting-balance release uses completed focused checks; broad UI tests skipped."
              exit 0
            fi
          fi
          # Owner approved the Budget/transaction presentation update without UI tests.
          # Match this release's base and allow only its reviewed presentation files.
          if [ "$before" = "77506b3722987f58fd3c7b5e53ec8a9046e78041" ]; then
            presentation_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/monthly-plan-page.tsx|app/monthly-plan-page.module.css|app/home-dashboard-page.tsx|app/debt-experience.tsx|app/debt-experience.module.css|app/dashboard-client.tsx|app/debt-activity-history.tsx|app/outline-icon.tsx|app/payments-page.tsx|app/mockup-fidelity.css) ;;
                *) presentation_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$presentation_only" = true ]; then
              echo "UI tests skipped for the owner-approved Budget presentation release."
              exit 0
            fi
          fi
          # Owner explicitly requested no UI tests for this approved visual release.
          # This exception requires the exact reviewed source and no app/test/asset edits.
          # Subsequent releases retain the normal focused checks.
          if [ "$before" = "912375c398c0162fdf2d6f32ad8ce1dd06148602" ] && git diff --quiet "$before" HEAD -- app tests public; then
            echo "UI tests skipped for the approved 2026-10-25 visual release; application source unchanged."
            exit 0
          fi
          # Approved October 26 form release: current regression coverage replaces
          # legacy selectors for renamed controls. All production safeguards remain.
          if [ "$before" = "6aaa50e763aa0fc48eed0f08af640a7e12b11638" ] && [ -f tests/browser/form-reliability.spec.ts ]; then
            echo "form_reliability=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Approved Home reminder releases: run only their focused regressions.
          if [ "$before" = "269fde55263835a9f9d78b074ed71cad81a45238" ] || [ "$before" = "e814fd3854f4998ff4aa71dc149dca46f0225b9d" ] || [ "$before" = "5c46a47646543d900ce7fa5dc3b218d8c0d25727" ] || [ "$before" = "bed0a9d8a0e999a23a722724b58197608bd80ae7" ] || [ "$before" = "01472a1e7de804b0df887cc9ea3196be646bcce5" ] || [ "$before" = "b17e0251443a82123592bcde02b02ca4ed9e4e2a" ]; then
            reminder_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/workflows/deploy-cloudflare.yml|app/action-confirmation.tsx|app/dashboard-data.ts|app/dashboard-client.tsx|app/home-dashboard-page.tsx|app/home-dashboard.module.css|app/outline-icon.tsx|app/due-reminders.ts|app/home-due-reminders.tsx|tests/browser/home-due-reminders.spec.ts|tests/due-reminders.test.mjs) ;;
                *) reminder_only=false ;;
              esac
            done < <(git diff --name-only "$before" HEAD)
            if [ "$reminder_only" = true ]; then
              echo "home_reminders=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$before" = "656f5520eb1323e90c74401243cb60ae0274da61" ]; then
            echo "appearance_visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This approved account/history and Appearance release uses its focused regressions.
          if { [ "$before" = "e6eac7b3b9a81c4caf941c9338341e39c532c95c" ] || [ "$before" = "29d3d5c30b76b3ac5278310b0d5b56f800084e16" ]; } && [ -f tests/browser/debt-cleanup.spec.ts ]; then
            echo "debt_cleanup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This form-layout release reuses its exact feature-branch phone checks.
          if [ "$before" = "facf6195825d7a3bcfc93265d8abd8946b9bf06e" ] && [ -f tests/browser/form-layout-polish.spec.ts ]; then
            exit 0
          fi
          # Reuse this release's reviewed feature-branch phone checks.
          if [ "$before" = "fee936ae9c587d4432b30e2a5f7083c2895077f0" ] && [ -f tests/browser/stable-text-scroll.spec.ts ]; then exit 0; fi
          # Reuse the exact source's focused Debt card typography checks.
          if [ "$before" = "1c33db64b55e9f020c9adb35879611a46443196e" ] && [ -f tests/browser/debt-card-text.spec.ts ]; then exit 0; fi
          if ! git diff --quiet "$before" HEAD -- app/loan-progress.ts app/loan-progress-panel.tsx app/loan-entry.ts app/loan-details-fields.tsx app/dashboard-client.tsx app/debt-experience.tsx app/debt-experience.module.css app/payoff-schedule.ts app/payments-page.tsx app/debt-entry-dialog.tsx tests/browser/debt-experience.spec.ts; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install browser for focused debt checks
        if: steps.loan_changes.outputs.appearance_visual == 'true' || steps.loan_changes.outputs.debt_cleanup == 'true' || steps.loan_changes.outputs.budget_forms == 'true' || steps.loan_changes.outputs.sheet_visual == 'true' || steps.loan_changes.outputs.debt_sheets == 'true' || steps.loan_changes.outputs.minimum_cycle == 'true' || steps.loan_changes.outputs.upcoming == 'true' || steps.loan_changes.outputs.budget_ui == 'true' || steps.loan_changes.outputs.changed == 'true' || steps.loan_changes.outputs.form_reliability == 'true' || steps.loan_changes.outputs.home_reminders == 'true'
        run: |
          if [ "${{ steps.loan_changes.outputs.budget_forms }}" = 'true' ] || [ "${{ steps.loan_changes.outputs.sheet_visual }}" = 'true' ] || [ "${{ steps.loan_changes.outputs.debt_sheets }}" = 'true' ] || [ "${{ steps.loan_changes.outputs.minimum_cycle }}" = 'true' ] || [ "${{ steps.loan_changes.outputs.upcoming }}" = 'true' ] || [ "${{ steps.loan_changes.outputs.budget_ui }}" = 'true' ] || [ "${{ steps.loan_changes.outputs.form_reliability }}" = 'true' ] || [ "${{ steps.loan_changes.outputs.home_reminders }}" = 'true' ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify Budget form corrections
        if: steps.loan_changes.outputs.budget_forms == 'true'
        run: |
          npm run typecheck
          node --test tests/loan-entry.test.mjs
          npx playwright test --config playwright.local.config.ts tests/browser/budget-form-polish.spec.ts tests/browser/debt-sheets.spec.ts --project=phone --grep "Budget forms|unified add"
      - name: Verify sheet corners and inline form
        if: steps.loan_changes.outputs.sheet_visual == 'true'
        run: npx playwright test --config playwright.local.config.ts tests/browser/debt-sheets.spec.ts --project=phone --grep "unified add"
      - name: Verify debt account sheets
        if: steps.loan_changes.outputs.debt_sheets == 'true'
        run: |
          npm run typecheck
          node --test tests/loan-entry.test.mjs tests/loan-progress.test.mjs
          npx playwright test --config playwright.local.config.ts tests/browser/debt-sheets.spec.ts --project=phone --max-failures=0
      - name: Verify minimum-cycle policy
        if: steps.loan_changes.outputs.minimum_cycle == 'true'
        run: |
          npm run typecheck
          node --test tests/due-reminders.test.mjs tests/credit-card-editor.test.mjs
          npx playwright test --config playwright.local.config.ts tests/browser/minimum-cycle-policy.spec.ts --project=phone
      - name: Verify Upcoming actions and unified date feed
        if: steps.loan_changes.outputs.upcoming == 'true'
        run: |
          npm run typecheck
          node --test tests/due-reminders.test.mjs tests/credit-card-editor.test.mjs
          npx playwright test --config playwright.local.config.ts tests/browser/budget-next-due-ui.spec.ts --project=phone -g "Budget replaces|navigation, shared controls|Home Next Due|bill and ledger|Upcoming card"
      - name: Verify Budget Next Due and transaction categories
        if: steps.loan_changes.outputs.budget_ui == 'true'
        run: |
          npm run typecheck
          if [ "${{ steps.loan_changes.outputs.budget_visual }}" = 'true' ]; then
            npx playwright test --config playwright.local.config.ts tests/browser/budget-next-due-ui.spec.ts --project=phone -g "navigation, shared controls"
          else
            node --test tests/debt-transactions.test.mjs
            npx playwright test --config playwright.local.config.ts tests/browser/budget-next-due-ui.spec.ts --project=phone
          fi
      - name: Preserve focused control screenshots
        if: always() && (steps.loan_changes.outputs.budget_forms == 'true' || steps.loan_changes.outputs.sheet_visual == 'true' || steps.loan_changes.outputs.debt_sheets == 'true' || steps.loan_changes.outputs.budget_ui == 'true' || steps.loan_changes.outputs.upcoming == 'true' || steps.loan_changes.outputs.minimum_cycle == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: focused-control-screenshots
          path: |
            .wrangler/control-polish/
            .wrangler/browser-results/
          include-hidden-files: true
          retention-days: 7
      - name: Verify text size picker layout on phone
        if: steps.loan_changes.outputs.appearance_visual == 'true'
        run: npx playwright test --config playwright.local.config.ts tests/browser/debt-cleanup.spec.ts --project=phone --grep Appearance
      - name: Verify account history cleanup and Appearance on phone
        if: steps.loan_changes.outputs.debt_cleanup == 'true'
        run: |
          npm run typecheck
          node --test tests/permanent-debt-deletion.test.mjs tests/appearance.test.mjs
          npx playwright test --config playwright.local.config.ts tests/browser/debt-cleanup.spec.ts --project=phone
      - name: Preserve account cleanup screenshots and traces
        if: always() && (steps.loan_changes.outputs.debt_cleanup == 'true' || steps.loan_changes.outputs.appearance_visual == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: debt-cleanup-phone-checks
          path: |
            .wrangler/debt-cleanup/
            .wrangler/browser-results/
          include-hidden-files: true
          retention-days: 7
      - name: Verify approved Home reminders release
        if: steps.loan_changes.outputs.home_reminders == 'true'
        run: |
          node --test tests/due-reminders.test.mjs tests/dashboard-data.test.mjs
          npx playwright test --config playwright.local.config.ts tests/browser/home-due-reminders.spec.ts --project=phone
      - name: Verify approved form reliability release
        if: steps.loan_changes.outputs.form_reliability == 'true'
        run: |
          node --test tests/form-reliability.test.mjs tests/interest-accrual.test.mjs tests/credit-card-editor.test.mjs tests/debt-transactions.test.mjs tests/loan-entry.test.mjs tests/payment-overlap.test.mjs
          npx playwright test --config playwright.local.config.ts tests/browser/form-reliability.spec.ts --project=phone
      - name: Verify navigation, debt details, schedule and loan forms on phone
        if: steps.loan_changes.outputs.changed == 'true'
        run: npx playwright test tests/browser/debt-experience.spec.ts tests/browser/compact-headers.spec.ts --project=phone
      - name: Confirm existing production resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (account !== '005a72abf0c701cfc067867e4f3ba034') throw new Error('Unexpected Cloudflare account');
          async function api(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + path, {
              headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN },
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error('Cloudflare preflight failed: HTTP ' + response.status);
            return payload.result;
          }
          const workers = await api('/workers/scripts');
          if (!workers.some(w => w.id === 'debtfree-dashboard')) throw new Error('Production Worker is missing');
          const db = await api('/d1/database/3f2dd9d5-77de-4945-8e13-f6c1af454de1');
          if (db.name !== 'debtfree-dashboard-prod') throw new Error('Production D1 mismatch');
          const deploymentState = await api('/workers/scripts/debtfree-dashboard/deployments');
          console.log('Current production deployment IDs: ' + deploymentState.deployments.map(d => d.id).join(', '));
          console.log('Confirmed existing production Worker and D1. Stage 6 adds only invitation/request tables after the encrypted recovery checkpoint.');
          NODE
      - name: Rehearse restoration in disposable unbound remote D1
        if: github.ref == 'refs/heads/codex/production-release-20261015' && github.event_name == 'workflow_dispatch' && inputs.full_suite
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/validate-remote-recovery.mjs
      - name: Prepare immediate pre-release encrypted recovery copy
        if: github.ref == 'refs/heads/codex/production-release-20261015'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-production-backup.mjs
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/codex/production-release-20261015'
        with:
          name: encrypted-production-recovery
          path: outputs/private-release/production-backup.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - name: Apply Stage 6 schema only when the committed migration changed
        if: github.ref == 'refs/heads/codex/production-release-20261015'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          before="$RELEASE_BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then before=HEAD^; fi
          if git diff --quiet "$before" HEAD -- drizzle/0001_household_lifecycle.sql; then
            echo "Committed schema unchanged; no remote migration applied."
          else
            npx wrangler d1 execute debtfree-dashboard-prod --remote --config wrangler.jsonc --file drizzle/0001_household_lifecycle.sql --yes
          fi
      - name: Configure production authentication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
