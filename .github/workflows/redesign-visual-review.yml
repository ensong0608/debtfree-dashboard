name: Redesign visual review
on:
  push:
    branches: [codex/visual-redesign-20261016, codex/reference-fidelity-20261016, codex/navigation-schedule-20261022, codex/compact-headers-appearance-20261024, codex/blue-slate-light-20261026]
permissions:
  contents: read
concurrency:
  group: redesign-visual-review
  cancel-in-progress: true
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser for focused review
        run: |
          if [ "$GITHUB_REF_NAME" = 'codex/blue-slate-light-20261026' ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Review navigation redesign on phone and desktop
        if: github.ref_name == 'codex/navigation-schedule-20261022'
        run: |
          npx playwright test tests/browser/debt-experience.spec.ts --project=phone --project=desktop --grep 'five tabs|Home preview' --max-failures=0
      - name: Verify compact headers and independent appearance colors
        if: github.ref_name == 'codex/compact-headers-appearance-20261024'
        run: |
          node --test tests/appearance.test.mjs
          npm run typecheck
          npx playwright test tests/browser/debt-experience.spec.ts tests/browser/compact-headers.spec.ts --project=phone
      - name: Verify approved Blue & Slate Light palette
        if: github.ref_name == 'codex/blue-slate-light-20261026'
        run: |
          node --test tests/appearance.test.mjs
          npx eslint app/appearance.ts app/appearance-settings.tsx tests/browser/blue-slate-light.spec.ts
          npm run typecheck
          npx playwright test tests/browser/blue-slate-light.spec.ts --project=phone
      - name: Review historical reference redesign
        if: github.ref_name != 'codex/navigation-schedule-20261022' && github.ref_name != 'codex/compact-headers-appearance-20261024' && github.ref_name != 'codex/blue-slate-light-20261026'
        run: npx playwright test tests/browser/redesign.spec.ts --project=phone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-synthetic-visual-review
          path: |
            outputs/ui-verification/redesign/
            outputs/redesign/
            outputs/compact-headers/
            outputs/blue-slate-light/
            .wrangler/browser-results/
          include-hidden-files: true
          retention-days: 7
