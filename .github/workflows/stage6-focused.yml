name: Stage 6 focused UI checks
on:
  push:
    branches: [codex/stage6-households-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/household-lifecycle.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stage6-ui-failures
          path: .wrangler/browser-results/
          include-hidden-files: true
          retention-days: 7
