name: Full validation (manual request only)
on:
  workflow_dispatch:
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Preserve UI verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ui-verification
          path: |
            outputs/ui-verification/
            .wrangler/browser-results/
          include-hidden-files: true
          retention-days: 7
