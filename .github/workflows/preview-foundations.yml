name: Validate and deploy foundations preview
on:
  push:
    branches: [codex/public-app-foundations-20261011, codex/visual-redesign-20261016, codex/reference-fidelity-20261016]
  workflow_dispatch:
    inputs:
      provision_isolation_fixture:
        description: Provision the private unrelated household (Stage 2)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-foundations-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Configure isolated preview resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (account !== '005a72abf0c701cfc067867e4f3ba034') throw new Error('Unexpected preview account');
          if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error('Cloudflare repository secret unavailable');
          const name = 'debtfree-dashboard-foundations-test';
          async function api(path, method = 'GET', body) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + path, {
              method, headers: {Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'content-type':'application/json'},
              ...(body ? {body:JSON.stringify(body)} : {}),
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error('Preview resource request failed for ' + path + ': HTTP ' + response.status + '; codes=' + (payload.errors ?? []).map(e => e.code).join(','));
            return payload.result;
          }
          const databases = await api('/d1/database?per_page=100');
          let db = databases.find(db => db.name === name);
          if (!db) db = await api('/d1/database', 'POST', {name});
          if (db.name !== name || db.uuid === '3f2dd9d5-77de-4945-8e13-f6c1af454de1') throw new Error('Preview database isolation failed');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = name;
          config.d1_databases = [{binding:'DB', database_name:name, database_id:db.uuid, migrations_dir:'drizzle'}];
          config.vars = {
            AUTH_PROVIDER:'supabase', SUPABASE_URL:'https://acpderotiyoecmwwyfsu.supabase.co',
            SUPABASE_PUBLISHABLE_KEY:'sb_publishable_QP7A5zZPic3K-L9Bf-oUaA_cNkdtCCy',
            APP_ORIGIN:'https://' + name + '.ensong0608.workers.dev',
          };
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config,null,2));
          console.log('Preview Worker and database isolated; no production writes.');
          NODE
      - name: Inspect release resource metadata (read only)
        id: release_resources
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-release-resources.mjs
      - name: Record resource inspection status
        if: always()
        env:
          INSPECTION_OUTCOME: ${{ steps.release_resources.outcome }}
        run: |
          echo "Read-only resource inspection: $INSPECTION_OUTCOME. Full IAM and authenticated release gates remain separate." >> "$GITHUB_STEP_SUMMARY"
      - name: Initialize preview schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply debtfree-dashboard-foundations-test --remote --config wrangler.jsonc
      - name: Deploy preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Configure private preview owner access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_OWNER_EMAIL: ${{ secrets.PREVIEW_OWNER_EMAIL }}
        run: |
          if [ -z "$PREVIEW_OWNER_EMAIL" ]; then
            echo "PREVIEW_OWNER_EMAIL repository secret is required for preview access."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const email=process.env.PREVIEW_OWNER_EMAIL?.trim().toLowerCase();
          if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Preview owner secret must contain a valid email');
          NODE
          printf '%s\n' "$PREVIEW_OWNER_EMAIL" | npx wrangler secret put HOUSEHOLD_OWNER_EMAIL --name debtfree-dashboard-foundations-test --config wrangler.jsonc
      - name: Verify login and API denial
        run: |
          node --input-type=module <<'NODE'
          const origin='https://debtfree-dashboard-foundations-test.ensong0608.workers.dev';
          let ready=false;
          for(let attempt=0;attempt<6;attempt++) {
            try {
              const login=await fetch(origin+'/auth/login',{cache:'no-store',signal:AbortSignal.timeout(5000)});
              ready=login.ok && (await login.text()).includes('Sign in with Google');
            } catch { /* Allow bounded deployment propagation/network readiness. */ }
            if(ready) break;
            if(attempt<5) await new Promise(resolve=>setTimeout(resolve,3000));
          }
          if(!ready) throw new Error('Preview login did not become ready');
          let accountSelectionReady=false;
          for(let attempt=0;attempt<6;attempt++) {
            try {
              const signin=await fetch(origin+'/auth/google',{
                method:'POST',headers:{Origin:origin},redirect:'manual',signal:AbortSignal.timeout(10000),
              });
              const authorization=new URL(signin.headers.get('location') ?? '/',origin);
              accountSelectionReady=signin.status===303 && authorization.origin==='https://acpderotiyoecmwwyfsu.supabase.co' &&
                authorization.pathname==='/auth/v1/authorize' && authorization.searchParams.get('provider')==='google' &&
                authorization.searchParams.get('prompt')==='select_account' &&
                authorization.searchParams.get('redirect_to')===origin+'/auth/callback' &&
                authorization.searchParams.get('code_challenge_method')==='s256' && !!authorization.searchParams.get('code_challenge');
            } catch { /* Allow bounded deployment propagation/network readiness. */ }
            if(accountSelectionReady) break;
            if(attempt<5) await new Promise(resolve=>setTimeout(resolve,3000));
          }
          if(!accountSelectionReady) throw new Error('Preview Google account-selection/PKCE callback configuration failed');
          console.log('Preview Google account-selection request and PKCE callback verified; no provider login performed.');
          for(const path of ['/api/household','/api/household/export']) {
            const response=await fetch(origin+path,{redirect:'manual'});
            if(![401,403].includes(response.status)) throw new Error('Preview unauthenticated data denial failed');
          }
          console.log('Preview URL: '+origin);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundations-preview-validation
          path: |
            .wrangler/browser-results/
            outputs/ui-verification/
          include-hidden-files: true
  isolation-fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.provision_isolation_fixture
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Provision private unrelated test household
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_OWNER_EMAIL: ${{ secrets.PREVIEW_OWNER_EMAIL }}
          PREVIEW_ISOLATION_EMAIL: ${{ secrets.PREVIEW_ISOLATION_EMAIL }}
        run: node scripts/provision-preview-isolation.mjs
